x-app: &app
  build: .
  image: apuestas:local
  env_file:
    - .env
  environment:
    - PORT=3000
  volumes:
    - ./data:/app/data
  restart: unless-stopped

services:
  app1:
    <<: *app
    environment:
      - PORT=3000
      - INSTANCE_ID=app1

  app2:
    <<: *app
    environment:
      - PORT=3000
      - INSTANCE_ID=app2

  app3:
    <<: *app
    environment:
      - PORT=3000
      - INSTANCE_ID=app3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${LB_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    restart: unless-stopped
